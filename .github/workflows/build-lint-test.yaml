name: build-lint-test

on: [push, workflow_dispatch, pull_request]

concurrency:
  group: ${{ github.head_ref }}
  cancel-in-progress: true

permissions: {}

# all jobs here must have a matrix identical to the ones inside build-and-release.yaml

jobs:
  scan:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          path: ${{ github.repository }}

      # Perform SCA analysis for the code repository
      # Produces SBOM and CVE report
      # Helps understand vulnerabilities / license compliance across third party dependencies
      # Drift: Doesn't track any npm global or OS specific packages that involves scanning entire root file system.
      # (TODO): Produce OS specific SBOM to detect build time depdencies.
      - id: sca-project
        uses: Kong/public-shared-actions/security-actions/sca@f2b77d6aa619dbe3bfcc1ac4f99af7d02614e90a # v4.1.0
        with:
          dir: ${{ github.repository }}
  setup:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    outputs:
      NODE_VERSION: ${{ steps.set-versions.outputs.NODE_VERSION }}
      ELECTRON_VERSION: ${{ steps.set-versions.outputs.ELECTRON_VERSION }}
      LIBCURL_RELEASE: ${{ steps.set-versions.outputs.LIBCURL_RELEASE }}
      LATEST_LIBCURL_RELEASE: ${{ steps.set-versions.outputs.LATEST_LIBCURL_RELEASE }}
      NODE_LIBCURL_CPP_STD: ${{ steps.set-versions.outputs.NODE_LIBCURL_CPP_STD }}
      npm_config_target: ${{ steps.set-versions.outputs.npm_config_target }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Read .node-version
        id: set-versions
        run: |
          NODE_VERSION=$(cat .node-version)
          ELECTRON_VERSION=$(cat .electron-version)
          LIBCURL_RELEASE=$(cat .libcurl-version)
          LATEST_LIBCURL_RELEASE=$(cat .libcurl-version)
          NODE_LIBCURL_CPP_STD=c++20
          npm_config_target=$(cat .electron-version)
          echo "NODE_VERSION=$NODE_VERSION" >> $GITHUB_OUTPUT
          echo "ELECTRON_VERSION=$ELECTRON_VERSION" >> $GITHUB_OUTPUT
          echo "LIBCURL_RELEASE=$LIBCURL_RELEASE" >> $GITHUB_OUTPUT
          echo "LATEST_LIBCURL_RELEASE=$LATEST_LIBCURL_RELEASE" >> $GITHUB_OUTPUT
          echo "NODE_LIBCURL_CPP_STD=$NODE_LIBCURL_CPP_STD" >> $GITHUB_OUTPUT
          echo "npm_config_target=$npm_config_target" >> $GITHUB_OUTPUT

  build-and-test-nodejs:
    needs: setup
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14-xlarge
          - ubuntu-22.04
          - ubuntu-22.04-arm
    env:
      NODE_VERSION: ${{ needs.setup.outputs.NODE_VERSION }}
      LIBCURL_RELEASE: ${{ needs.setup.outputs.LIBCURL_RELEASE }}
      LATEST_LIBCURL_RELEASE: ${{ needs.setup.outputs.LATEST_LIBCURL_RELEASE }}
      NODE_LIBCURL_CPP_STD: ${{ needs.setup.outputs.NODE_LIBCURL_CPP_STD }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - id: timestamp
        run: echo "timestamp=$(timestamp +%s)" >> $GITHUB_OUTPUT
      - if: runner.os == 'macOS'
        name: Install Needed packages on macOS
        run: brew install coreutils automake libtool cmake gnu-sed m4 autoconf groff
      - if: runner.os == 'Linux'
        name: Install Needed packages on Linux
        run: sudo apt-get install -y cmake
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Restore libcurl deps cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: libcurl-deps-cache
        with:
          path: |
            ~/.node-gyp
            ~/deps
          key: v4-build-lint-test-${{ matrix.os }}-libcurl-deps-cache-node-${{ env.NODE_VERSION }}
          restore-keys: |
            v4-build-lint-test-${{ matrix.os }}-libcurl-deps-cache-node-${{ env.NODE_VERSION }}
      - name: Build node-libcurl ${{ env.NODE_VERSION }}
        run: |
          RUN_TESTS=false \
          RUN_PREGYP_CLEAN=false \
          PUBLISH_BINARY=false \
            ./scripts/ci/build.sh
      - name: 'Run lint'
        run: npm run lint
      - name: 'Run tsc'
        run: npm run build:dist
      # we do run tests in all matrix jobs
      - name: 'Run tests'
        run: npm run test
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ matrix.os }}-${{ env.LIBCURL_RELEASE }}-${{ env.NODE_VERSION }}
          path: ./logs/
          retention-days: 3

  build-and-test-electron:
    needs: setup
    permissions:
      contents: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-14-xlarge
          - ubuntu-22.04
          - ubuntu-22.04-arm
    env:
      NODE_VERSION: ${{ needs.setup.outputs.NODE_VERSION }}
      ELECTRON_VERSION: ${{ needs.setup.outputs.ELECTRON_VERSION }}
      LIBCURL_RELEASE: ${{ needs.setup.outputs.LIBCURL_RELEASE }}
      LATEST_LIBCURL_RELEASE: ${{ needs.setup.outputs.LATEST_LIBCURL_RELEASE }}
      NODE_LIBCURL_CPP_STD: ${{ needs.setup.outputs.NODE_LIBCURL_CPP_STD }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - id: timestamp
        run: echo "timestamp=$(timestamp +%s)" >> $GITHUB_OUTPUT
      - if: runner.os == 'macOS'
        name: Install Needed packages on macOS
        run: brew install coreutils automake libtool cmake gnu-sed m4 autoconf groff
      - if: runner.os == 'Linux'
        name: Install Needed packages on Linux
        run: sudo apt-get install -y cmake
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Restore Electron Cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
          key: v1-${{ matrix.os }}-electron-cache-${{ env.ELECTRON_VERSION }}
          restore-keys: |
            v1-${{ matrix.os }}-electron-cache-${{ env.ELECTRON_VERSION }}
            v1-${{ matrix.os }}-electron-cache-
      - name: Restore libcurl deps cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: libcurl-deps-cache
        with:
          path: |
            ~/.node-gyp
            ~/deps
          key: v4-build-lint-test-${{ matrix.os }}-libcurl-deps-cache-electron-${{ env.ELECTRON_VERSION }}
          restore-keys: |
            v4-build-lint-test-${{ matrix.os }}-libcurl-deps-cache-electron-${{ env.ELECTRON_VERSION }}
      - name: 'Set GIT_TAG'
        if: startsWith(github.ref, 'refs/tags')
        run: echo "GIT_TAG=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Build node-libcurl ${{ env.NODE_VERSION }} ${{ env.ELECTRON_VERSION }}
        run: |
          RUN_TESTS=true \
          RUN_PREGYP_CLEAN=false \
          PUBLISH_BINARY=false \
            ./scripts/ci/build.sh
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-logs-${{ matrix.os }}-${{ env.LIBCURL_RELEASE }}-${{ env.ELECTRON_VERSION }}
          path: ./logs/
          retention-days: 5

  build-and-test-nodejs-windows:
    needs: setup
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-vs2026-arm
            arch: arm64
    env:
      npm_config_msvs_version: 2026
      npm_config_build_from_source: true
      npm_config_target_arch: ${{ matrix.arch }}
      NODE_VERSION: ${{ needs.setup.outputs.NODE_VERSION }}
      LIBCURL_RELEASE: ${{ needs.setup.outputs.LIBCURL_RELEASE }}
      LATEST_LIBCURL_RELEASE: ${{ needs.setup.outputs.LATEST_LIBCURL_RELEASE }}
      NODE_LIBCURL_CPP_STD: ${{ needs.setup.outputs.NODE_LIBCURL_CPP_STD }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install NASM
        if: matrix.arch == 'x64'
        run: |
          choco install nasm -y
          echo "NASM_PATH=$env:PROGRAMFILES\NASM" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: |
          if ($env:NASM_PATH) {
            $env:PATH = "$env:NASM_PATH;$env:Path"
          }
          Push-Location deps\curl-for-windows
          git submodule update --init --recursive
          $configureArgs = @()
          if ("${{ matrix.arch }}" -eq "arm64") {
            $configureArgs = @("--target-arch", "arm64")
          }
          python configure.py @configureArgs
          Pop-Location
      - name: Build ${{ env.NODE_VERSION }}
        run: |
          if ($env:NASM_PATH) {
            $env:PATH = "$env:NASM_PATH;$env:Path"
          }
          npm ci
      - name: Test
        run: |
          npm run ts-node -e "console.log(require('./lib').Curl.getVersionInfoString())"
          npm run test

          if ($LASTEXITCODE -eq 0) {
            $host.SetShouldExit(0)
          }

  build-and-test-electron-windows:
    needs: setup
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-vs2026-arm
            arch: arm64
    env:
      npm_config_msvs_version: 2026
      npm_config_build_from_source: true
      npm_config_target_arch: ${{ matrix.arch }}
      npm_config_runtime: 'electron'
      npm_config_dist_url: 'https://electronjs.org/headers'
      npm_config_target: ${{ needs.setup.outputs.npm_config_target }}
      NODE_VERSION: ${{ needs.setup.outputs.NODE_VERSION }}
      ELECTRON_VERSION: ${{ needs.setup.outputs.ELECTRON_VERSION }}
      LIBCURL_RELEASE: ${{ needs.setup.outputs.LIBCURL_RELEASE }}
      LATEST_LIBCURL_RELEASE: ${{ needs.setup.outputs.LATEST_LIBCURL_RELEASE }}
      NODE_LIBCURL_CPP_STD: ${{ needs.setup.outputs.NODE_LIBCURL_CPP_STD }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install NASM
        if: matrix.arch == 'x64'
        run: |
          choco install nasm -y
          echo "NASM_PATH=$env:PROGRAMFILES\NASM" >> $env:GITHUB_ENV
      - name: Install dependencies
        run: |
          if ($env:NASM_PATH) {
            $env:PATH = "$env:NASM_PATH;$env:Path"
          }
          Push-Location deps\curl-for-windows
          git submodule update --init --recursive
          $configureArgs = @()
          if ("${{ matrix.arch }}" -eq "arm64") {
            $configureArgs = @("--target-arch", "arm64")
          }
          python configure.py @configureArgs
          Pop-Location
          npm install -g electron@${env:ELECTRON_VERSION}
      - name: Build ${{ env.NODE_VERSION }}
        run: |
          if ($env:NASM_PATH) {
            $env:PATH = "$env:NASM_PATH;$env:Path"
          }
          npm ci
      - name: Test
        run: |
          npm run test:electron

          if ($LASTEXITCODE -eq 0) {
            $host.SetShouldExit(0)
          }
