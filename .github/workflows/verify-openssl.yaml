name: verify-openssl

on:
  workflow_dispatch:
  push:
    branches:
      - test/verify-openssl-3.5.9

permissions: {}

# Scratch workflow used to validate the OpenSSL 3.5.9 upgrade before it is merged:
# builds the binding from source on every platform, checks the linked OpenSSL
# version, exercises the TLS paths and uploads Electron binaries that can be
# dropped into a local Insomnia install.

jobs:
  verify:
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x64
          - runner: windows-11-vs2026-arm
            arch: arm64
          - runner: macos-14
            arch: arm64
          - runner: ubuntu-22.04
            arch: x64
    env:
      npm_config_msvs_version: 2026
      npm_config_build_from_source: true
    steps:
      - name: Install Needed packages on macOS
        if: runner.os == 'macOS'
        run: brew install coreutils automake libtool cmake gnu-sed m4 autoconf groff
      - name: Install Needed packages on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get install -y cmake
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install NASM
        if: runner.os == 'Windows' && matrix.arch == 'x64'
        run: |
          choco install nasm -y
          echo "NASM_PATH=$env:PROGRAMFILES\NASM" >> $env:GITHUB_ENV
      - name: Configure libcurl build
        if: runner.os == 'Windows'
        run: |
          if ($env:NASM_PATH) { $env:PATH = "$env:NASM_PATH;$env:Path" }
          Push-Location deps\curl-for-windows
          git submodule update --init --recursive
          $configureArgs = @()
          if ("${{ matrix.arch }}" -eq "arm64") { $configureArgs = @("--target-arch", "arm64") }
          python configure.py @configureArgs
          Pop-Location
      - name: Build from source (node runtime)
        run: |
          if ($env:NASM_PATH) { $env:PATH = "$env:NASM_PATH;$env:Path" }
          npm ci
          npm run build:dist
      - name: Verify OpenSSL version and TLS behaviour
        run: node scripts/verify-openssl.js
      - name: Rebuild for Electron (Insomnia)
        if: runner.os == 'Windows'
        run: |
          if ($env:NASM_PATH) { $env:PATH = "$env:NASM_PATH;$env:Path" }
          ./node_modules/.bin/node-pre-gyp rebuild --runtime=electron --target=43.2.0 --dist-url=https://electronjs.org/headers
          npm run pregyp package testpackage --verbose
      - name: Upload Electron binary
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-libcurl-electron-win32-${{ matrix.arch }}
          path: build/stage/**/*.tar.gz
          if-no-files-found: error
          retention-days: 7
